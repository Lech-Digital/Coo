name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The production deploy runs these first (.github/workflows/deploy.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, format and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Android projects are not built here: they need the maui-android workload, which adds
      # minutes to every run. Everything testable lives in net10.0 projects (ADR 0001 §3),
      # and Coo.Tests.slnf covers them all. See BUILD.md for the Android build.
      - name: Restore
        run: dotnet restore Coo.Tests.slnf

      - name: Format
        run: dotnet format Coo.Tests.slnf --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Coo.Tests.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test Coo.Tests.slnf --configuration Release --no-build --verbosity normal

      # The PostgreSQL tests above use Docker (Testcontainers). Building the API image here means a broken
      # Dockerfile fails CI, not the deploy (Spec 008 §9).
      - name: Build the API image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t coo-api:ci .
