# R8 for Release (owner, 2026-11-03: Play flagged "Obfuscation 0%"). .NET for Android adds keep rules for every Java type
# the managed code touches, and the AARs (Play Billing, Play Core, AndroidX) bring their own consumer rules; these are
# the ones neither covers.

# Credential Manager finds its Google Play services provider by reflection (androidx.credentials documentation).
-if class androidx.credentials.CredentialManager
-keep class androidx.credentials.playservices.** { *; }
-keep class com.google.android.libraries.identity.googleid.** { *; }

# Play Billing's AIDL interface to the Play Store app.
-keep class com.android.vending.billing.** { *; }

# Keep line numbers for readable crash reports; Play retraces the renamed names with the mapping file.
-keepattributes SourceFile,LineNumberTable
-renamesourcefileattribute SourceFile
