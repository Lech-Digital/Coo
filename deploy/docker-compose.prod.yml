# Coo backend, production stack (Spec 008 §2). It runs beside Coldstart, PurePrep and CoreChoice on the same
# Hetzner host and reuses Coldstart's Caddy (the `coldstart_default` network) for HTTPS. Caddy proxies
# api.coo.lechdigital.nl to the CONTAINER name `coo-api`.
#
# Names are product-prefixed (ADR 0001 §5): Compose publishes service names as DNS aliases on the shared
# network, and a generic name such as "web" or "db" once hijacked a neighbour's traffic.
#
# Deploy with deploy/deploy-prod.sh, which runs, from /opt/coo:
#   GIT_SHA=<commit> docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build
name: coo

services:
  coo-api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: coo-api
    container_name: coo-api
    restart: unless-stopped
    depends_on:
      coo-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Coo: Host=coo-postgres;Database=coo;Username=coo;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};Gss Encryption Mode=Disable
      # Gemini API (Spec 012)
      Gemini__ApiKey: ${COO_GEMINI_API_KEY:?set COO_GEMINI_API_KEY in .env}
      # Sign-in (Spec 010 §4.3). The API refuses to start without them; compose refuses to start without the .env lines.
      Auth__GoogleWebClientId: ${AUTH_GOOGLE_WEB_CLIENT_ID:?set AUTH_GOOGLE_WEB_CLIENT_ID in .env}
      Auth__SigningKeys__k1: ${AUTH_SIGNING_KEY_K1:?set AUTH_SIGNING_KEY_K1 in .env}
      # App Links (Spec 011b §4.2): the API refuses to start without a signing-certificate fingerprint.
      AppLinks__Sha256CertFingerprints__0: ${APPLINKS_SHA256_DEBUG:?set APPLINKS_SHA256_DEBUG in .env}
      # Play App Signing's certificate (Play Console → Setup → App signing): Play-installed builds are signed with it,
      # so invitation links open in them only once it is here (Increment 18). Empty is skipped.
      AppLinks__Sha256CertFingerprints__1: ${APPLINKS_SHA256_PLAY:-}
      # Billing (Spec 012): the Play Developer API service account (JSON, one line) verifies purchases. The API refuses to
      # start without it (ADR 0004 §5), and compose refuses before replacing the running container. The RTDN token is the
      # ?token= of the Pub/Sub push URL; without it the webhook is off and the hourly recheck keeps purchases current.
      GooglePlay__CredentialsJson: ${GOOGLE_PLAY_CREDENTIALS_JSON:?set GOOGLE_PLAY_CREDENTIALS_JSON in .env}
      Billing__RtdnToken: ${BILLING_RTDN_TOKEN:-}
      # Accounts whose families get Premium without buying (comma-separated emails): the Play reviewers' test account.
      Billing__ComplimentaryEmails: ${BILLING_COMPLIMENTARY_EMAILS:-}
      # Invitation codes (Spec 011b §10.3): the pepper of their stored hashes. The API refuses to start without it.
      Invitations__CodePepper: ${INVITATIONS_CODE_PEPPER:?set INVITATIONS_CODE_PEPPER in .env}
    networks:
      - coo_internal
      - coldstart_default
    expose:
      - "8080"
    mem_limit: 384m

  coo-postgres:
    image: postgres:17
    container_name: coo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coo
      POSTGRES_USER: coo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    volumes:
      - coo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coo -d coo"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Private network only: Caddy cannot reach the database, and it publishes no port.
    networks:
      - coo_internal
    mem_limit: 384m

  # Coldstart's backup container, with Coo's names (Spec 008 §6): the first dump 10 minutes after start, so the API
  # has applied its migrations, then every 24 hours, kept RETENTION_DAYS days on the host. Hetzner's server backups
  # copy them off the machine.
  coo-backup:
    image: postgres:17
    container_name: coo-backup
    restart: unless-stopped
    depends_on:
      coo-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      RETENTION_DAYS: "14"
    entrypoint:
      - bash
      - -c
      - |
        sleep 600
        while true; do
          ts=$$(date -u +%F-%H%M)
          if pg_dump -h coo-postgres -U coo -d coo -Fc -f "/backups/coo-$$ts.dump"; then
            echo "backup ok: coo-$$ts.dump"
            find /backups -name 'coo-*.dump' -mtime "+$$RETENTION_DAYS" -delete
          else
            echo "backup FAILED at $$ts" >&2
          fi
          sleep 86400
        done
    volumes:
      - ${COO_BACKUP_DIR:-/opt/coo/backups}:/backups
    networks:
      - coo_internal
    mem_limit: 128m

networks:
  coo_internal:
    name: coo_internal
    internal: true
  # Coldstart's Caddy lives on this network; joining it lets Caddy reach coo-api by its container name.
  coldstart_default:
    external: true

volumes:
  coo-postgres-data:
